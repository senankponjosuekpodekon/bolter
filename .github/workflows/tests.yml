name: Client tests

on:
  pull_request:
  push:
    branches: [main, local]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run client unit tests
        run: npm --workspace=client run test --silent

  e2e:
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      xvfb:
        image: "selenium/standalone-chrome"
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Start dev server
        run: npm --workspace=client run dev &
      - name: Wait for server
        uses: jakejarvis/wait-action@v0.1.0
        with:
          timeout: "30s"
          url: "http://localhost:5173"
      - name: Run Playwright tests
        run: npm --workspace=client run e2e --reporter=list

  i18n-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Start dev server
        run: npm --workspace=client run dev &
      - name: Wait for server
        uses: jakejarvis/wait-action@v0.1.0
        with:
          timeout: "30s"
          url: "http://localhost:5173"
      - name: Run i18n smoke tests
        run: npx playwright test e2e/tests/locale.spec.ts --reporter=list
        working-directory: apps/client

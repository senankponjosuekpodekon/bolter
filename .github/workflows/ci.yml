name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, local]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "18.x"

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint client
        run: |
          cd apps/client
          npm run lint || true

      - name: Lint server
        run: |
          cd apps/server
          npm run lint || true

  test-client:
    name: Test Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run client unit tests
        run: |
          cd apps/client
          npm test -- --run

      - name: Generate coverage report
        run: |
          cd apps/client
          npm run test:coverage || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./apps/client/coverage/coverage-final.json
          flags: client
          name: client-coverage
        continue-on-error: true

  test-server:
    name: Test Server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: banking_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run server unit tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/banking_test
          JWT_SECRET: test-secret-key-for-ci
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-ci
        run: |
          cd apps/server
          npm test || true

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./apps/server/coverage/coverage-final.json
          flags: server
          name: server-coverage
        continue-on-error: true

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: banking_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: |
          cd apps/client
          npx playwright install --with-deps chromium

      - name: Build client
        run: |
          cd apps/client
          npm run build

      - name: Build server
        run: |
          cd apps/server
          npm run build

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/banking_e2e
        run: |
          cd apps/server
          # Add migration command here when available

      - name: Start server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/banking_e2e
          JWT_SECRET: test-secret-key-for-e2e
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-e2e
          PORT: 3000
        run: |
          cd apps/server
          npm start &
          sleep 10
        continue-on-error: true

      - name: Run E2E tests
        env:
          VITE_API_BASE_URL: http://localhost:3000
        run: |
          cd apps/client
          npm run e2e || true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report
          path: apps/client/playwright-report/
          retention-days: 30

  build:
    name: Build Applications
    runs-on: ubuntu-latest
    needs: [lint, test-client, test-server]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: |
          cd apps/client
          npm run build

      - name: Build server
        run: |
          cd apps/server
          npm run build

      - name: Upload client build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: client-dist
          path: apps/client/dist/
          retention-days: 7

      - name: Upload server build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: server-dist
          path: apps/server/dist/
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate || true

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true
        with:
          project: "bolter-banking"
          path: "."
          format: "HTML"

      - name: Upload dependency check results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: dependency-check-report
          path: reports/
          retention-days: 30
